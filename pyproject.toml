[project]
name = "dlp-mcp"
version = "0.1.0"
description = "MCP server that decrypts encrypted files for ChatGPT inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "cryptography>=44.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.34",
    "starlette>=0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
]

[project.scripts]
dlp-mcp = "dlp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
