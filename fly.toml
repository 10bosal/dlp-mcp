# fly.toml app configuration file generated for dlp-mcp on 2026-06-12T16:21:29+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dlp-mcp'
primary_region = 'nrt'

[build]

[env]
  MAX_FILE_SIZE_MB = '50'
  TEMP_DIR = '/tmp/dlp-mcp'
  TEMP_TTL_SECONDS = '3600'
  TEMP_CLEANUP_INTERVAL_SECONDS = '3600'
  AUDIT_RETENTION_SECONDS = '2592000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
