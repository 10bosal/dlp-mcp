app = "dlp-mcp"
primary_region = "nrt"

[build]

[env]
  TEMP_DIR = "/tmp/dlp-mcp"
  MAX_FILE_SIZE_MB = "50"
  TEMP_TTL_SECONDS = "3600"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
